volumes:
  files_data:    # shared between worker-whisper (write) and file-server (read)
  ollama_models: # Ollama model cache; persists across container recreations
  higgs_models:  # Hugging Face model cache for Higgs Audio v3 (bosonai/higgs-audio-v3-tts-4b)

services:
  worker-echo:
    build:
      context: ../../workers
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # Primary location (legacy): /etc/ai-platform/worker-echo.env (root-owned)
      # Fallback location: ~/.config/ai-platform/worker-echo.env (user-writable)
      # worker_base/config.py enforces required vars at startup.
      - path: /etc/ai-platform/worker-echo.env
        required: false
      - path: ${HOME}/.config/ai-platform/worker-echo.env
        required: false
    network_mode: host
    # network_mode: host gives the container access to Tailscale (tailscale0 interface).
    # ialab never exposes worker containers to the internet — Tailscale ACLs enforce this.

  worker-whisper:
    build:
      context: ../../workers
      dockerfile: Dockerfile.whisper
    restart: unless-stopped
    env_file:
      - path: /etc/ai-platform/worker-whisper.env
        required: false
      - path: ${HOME}/.config/ai-platform/worker-whisper.env
        required: false
    volumes:
      - files_data:/app/files
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    # Pinned at T6.2 (2026-06-18). Model: qwen2.5:7b @ 845dbda0ea48...
    image: ollama/ollama@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    restart: unless-stopped
    network_mode: host
    environment:
      # Bind only to localhost — worker-ollama reaches it via 127.0.0.1:11434
      # (both services share the host network via network_mode: host).
      OLLAMA_HOST: "127.0.0.1:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker-ollama:
    build:
      context: ../../workers
      dockerfile: Dockerfile.ollama
    restart: unless-stopped
    env_file:
      - path: /etc/ai-platform/worker-ollama.env
        required: false
      - path: ${HOME}/.config/ai-platform/worker-ollama.env
        required: false
    environment:
      # OLLAMA_HOST and OLLAMA_MODEL are set here as fallback defaults — they are also
      # in the env_file, which takes precedence when the env file is present.
      # OLLAMA_IDLE_TIMEOUT is intentionally NOT set here: it must come from the env_file
      # so operators can tune it without rebuilding the compose (default in worker: 600s).
      OLLAMA_HOST: "http://127.0.0.1:11434"
      OLLAMA_MODEL: "qwen2.5:7b"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Higgs Audio v3 TTS engine — Docker+SGLang-Omni sidecar.
  # Image built locally in ialab from aibum/deploy (digest ccbf6652d973).
  # Listens on 127.0.0.1:8002 (host network) — only reachable from worker-tts on the same host.
  # Model: bosonai/higgs-audio-v3-tts-4b; VRAM pico medido: 14720 MiB (T7.2).
  higgs-tts:
    image: aibum-higgs-tts:latest
    # restart: no — worker-tts gestiona el ciclo de vida de este container via docker stop/start.
    # Con unless-stopped, docker compose reiniciaría el container cuando worker-tts llama docker stop,
    # porque compose no distingue entre docker stop manual y un crash.
    restart: "no"
    network_mode: host
    ipc: host
    shm_size: '32g'
    command: sgl-omni serve --model-path bosonai/higgs-audio-v3-tts-4b --port 8002 --host 127.0.0.1
    volumes:
      - higgs_models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker-tts:
    build:
      context: ../../workers
      dockerfile: Dockerfile.tts
    restart: unless-stopped
    env_file:
      - path: /etc/ai-platform/worker-tts.env
        required: false
      - path: ${HOME}/.config/ai-platform/worker-tts.env
        required: false
    environment:
      # TTS_HOST and TTS_IDLE_TIMEOUT are set here as fallback defaults — they are also
      # in the env_file, which takes precedence when the env file is present.
      # TTS_REFERENCE_AUDIO_PATH and TTS_REFERENCE_TEXT are intentionally NOT set here:
      # they must come from the env_file so operators can configure voice cloning without
      # rebuilding the compose (no default — standard TTS if not set).
      TTS_HOST: "http://127.0.0.1:8002"
    volumes:
      - files_data:/app/files
      # Docker socket: lets worker-tts stop/start the higgs-tts sidecar for idle unload.
      # SGLang-Omni has no API to release GPU memory; stopping the container is the only way.
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host

  file-server:
    image: python:3.12-slim
    command:
      - python3
      - -m
      - http.server
      - "8001"
      - --bind
      - "100.103.55.110"
      - --directory
      - /data
    volumes:
      - files_data:/data/files
    network_mode: host
    # Binds to the Tailscale IP of ialab (100.103.55.110), never 0.0.0.0.
    # URL layout: http://100.103.55.110:8001/files/{job_id}/{filename}
    # Only reachable from the VPS via Tailscale (ACLs enforced by tailnet).
    restart: unless-stopped
