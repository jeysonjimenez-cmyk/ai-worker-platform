services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # port NOT exposed to the internet — localhost only
    ports:
      - "127.0.0.1:5433:5432"

  api:
    image: busybox
    restart: unless-stopped
    command: ["sh", "-c", "while true; do printf 'HTTP/1.1 200 OK\\r\\n\\r\\nOK' | nc -l -p 8080; done"]
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
